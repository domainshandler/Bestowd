name: Mobile

on:
  push:
    paths: ['apps/mobile/**', '.github/workflows/mobile.yml']
  pull_request:
    paths: ['apps/mobile/**', '.github/workflows/mobile.yml']

jobs:
  core-and-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Core tests
        run: dotnet test Bestowd.Core.Tests
      - name: Install MAUI Android workload
        run: dotnet workload install maui-android
      - name: Android SDK
        run: dotnet build Bestowd.Mobile -t:InstallAndroidDependencies -f net10.0-android -p:AndroidSdkDirectory=$HOME/android-sdk -p:AcceptAndroidSDKLicenses=True
      - name: Build Android (release)
        run: dotnet publish Bestowd.Mobile -c Release -f net10.0-android -p:AndroidSdkDirectory=$HOME/android-sdk

  ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install MAUI iOS workload
        run: dotnet workload install maui-ios
      - name: Build iOS (simulator)
        run: dotnet build Bestowd.Mobile -f net10.0-ios
