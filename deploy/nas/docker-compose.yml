# Bestowd dev API + Postgres on the home NAS (192.168.1.103). Dev only; safe to throw away.
# From this folder:  docker compose up -d --build
# Project name is fixed so it never collides with other compose projects on the NAS (e.g. "bestowd").
name: bestowd-dev
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bestowd
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: bestowd
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bestowd -d bestowd"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://bestowd:${POSTGRES_PASSWORD}@db:5432/bestowd
      DIRECT_URL: postgresql://bestowd:${POSTGRES_PASSWORD}@db:5432/bestowd
    ports:
      - "3000:3000"

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${API_PUBLIC_URL:-http://192.168.1.103:3000}
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
    restart: unless-stopped
    ports:
      - "8080:80"

volumes:
  db-data:
